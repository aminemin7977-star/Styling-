    <!-- AUDIO SYNTHESIZER FOR SOUND EFFECTS -->
    <script>
        // Web Audio API Synthesizer (No external audio files needed)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (isMuted) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'dress') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12); // E5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'magic') {
                    // Arpeggio sound for magic/randomize
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const subOsc = audioCtx.createOscillator();
                        const subGain = audioCtx.createGain();
                        subOsc.type = 'sine';
                        subOsc.frequency.setValueAtTime(freq, now + idx * 0.06);
                        subGain.gain.setValueAtTime(0.12, now + idx * 0.06);
                        subGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.1);
                        subOsc.connect(subGain);
                        subGain.connect(audioCtx.destination);
                        subOsc.start(now + idx * 0.06);
                        subOsc.stop(now + idx * 0.06 + 0.1);
                    });
                } else if (type === 'camera') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.setValueAtTime(400, now + 0.05);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function toggleSound() {
            isMuted = !isMuted;
            const btn = document.getElementById('soundToggleBtn');
            const icon = document.getElementById('soundIcon');
            if (isMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                btn.classList.add('opacity-60');
                showToast('تم إيقاف الصوت', 'info');
            } else {
                icon.className = 'fa-solid fa-volume-high';
                btn.classList.remove('opacity-60');
                playSound('click');
                showToast('تم تفعيل الصوت', 'success');
            }
        }
    </script>

        // Render functions for Doll SVGs

                <!-- Torso Base -->
                <path d="M155 255 L245 255 L230 380 L170 380 Z" fill="${skinItem.color}" />

            // 2. FACE & MAKEUP

            // 3. DRESSES OR TOPS+BOTTOMS TOGGLE LOGIC

            const bottomsLayer = document.getElementById('layer-bottoms');

            if (activeState.dresses && activeState.dresses !== 'none') {

                const dress = database.dresses.find(d => d.id === activeState.dresses);

                        dressSvg = `

            } else {
                dressesLayer.innerHTML = '';

                // Render TOPS
                const top = database.tops.find(t => t.id === activeState.tops);
                let topSvg = '';
                if (top && top.type !== 'none') {
                    if (top.type === 'tshirt') {
                        topSvg = `
                            <path d="M150 255 L250 255 L240 295 L225 345 L175 345 L160 295 Z" fill="${top.color}" />
                            <path d="M150 255 L125 295 L150 310 L165 275 Z" fill="${top.color}" />
                            <path d="M250 255 L275 295 L250 310 L235 275 Z" fill="${top.color}" />
                            <!-- Heart Graphic -->
                            <path d="M200 295 C195 285 185 288 188 298 C192 305 200 310 200 310 C200 310 208 305 212 298 C215 288 205 285 200 295 Z" fill="#FFFFFF" />

                    } else if (top.type === 'crop') {
                        topSvg = `
                            <path d="M160 255 L240 255 L230 310 L170 310 Z" fill="${top.color}" />
                            <path d="M185 255 L200 275 L215 255 Z" fill="#111" opacity="0.2" />
                        `;
                    } else if (top.type === 'blouse') {
                        topSvg = `
                            <path d="M155 250 L245 250 L235 350 L165 350 Z" fill="${top.color}" />
                            <path d="M155 250 L135 330 L155 335 L165 275 Z" fill="${top.color}" opacity="0.9"/>
                            <path d="M245 250 L265 330 L245 335 L235 275 Z" fill="${top.color}" opacity="0.9"/>
                        `;
                    } else if (top.type === 'hoodie') {
                        topSvg = `
                            <path d="M145 245 L255 245 L245 355 L155 355 Z" fill="${top.color}" />
                            <path d="M145 245 L120 340 L145 345 Z" fill="${top.color}" />
                            <path d="M255 245 L280 340 L255 345 Z" fill="${top.color}" />
                            <rect x="175" y="310" width="50" height="35" rx="5" fill="#FFFFFF" opacity="0.3" />
                        `;
                    }
                }
                topsLayer.innerHTML = topSvg;

                // Render BOTTOMS
                const bottom = database.bottoms.find(b => b.id === activeState.bottoms);
                let bottomSvg = '';
                if (bottom && bottom.type !== 'none') {
                    if (bottom.type === 'skirt') {
                        bottomSvg = `
                            <path d="M168 340 L232 340 L255 440 L145 440 Z" fill="${bottom.color}" />
                        `;
                    } else if (bottom.type === 'jeans') {
                        bottomSvg = `
                            <path d="M168 340 L232 340 L238 565 L203 565 L200 420 L197 565 L162 565 Z" fill="${bottom.color}" />
                            <!-- Stitch Details -->
                            <path d="M168 340 L232 340" stroke="#FFD700" stroke-width="2" stroke-dasharray="4,4" />
                        `;
                    } else if (bottom.type === 'shorts') {
                        bottomSvg = `
                            <path d="M168 340 L232 340 L236 400 L203 400 L200 375 L197 400 L164 400 Z" fill="${bottom.color}" />
                        `;
                    } else if (bottom.type === 'longskirt') {
                        bottomSvg = `
                            <path d="M168 340 L232 340 L270 575 L130 575 Z" fill="${bottom.color}" />
                        `;
                    }
                }
                bottomsLayer.innerHTML = bottomSvg;
            }

            // 4. SHOES
            const shoe = database.shoes.find(s => s.id === activeState.shoes);
            let shoeSvg = '';
            if (shoe) {
                if (shoe.style === 'heels') {
                    shoeSvg = `
                        <path d="M162 565 L193 565 L193 580 L180 585 L162 575 Z" fill="${shoe.color}" />
                        <path d="M207 565 L238 565 L238 575 L220 585 L207 580 Z" fill="${shoe.color}" />
                        <rect x="163" y="575" width="4" height="20" fill="#111" />
                        <rect x="233" y="575" width="4" height="20" fill="#111" />
                    `;
                } else if (shoe.style === 'sneakers') {
                    shoeSvg = `
                        <rect x="158" y="560" width="36" height="25" rx="8" fill="${shoe.color}" />
                        <rect x="206" y="560" width="36" height="25" rx="8" fill="${shoe.color}" />
                        <rect x="158" y="577" width="36" height="8" rx="2" fill="#333" />
                        <rect x="206" y="577" width="36" height="8" rx="2" fill="#333" />
                    `;
                } else if (shoe.style === 'boots') {
                    shoeSvg = `
                        <path d="M162 490 L194 490 L194 585 L162 585 Z" fill="${shoe.color}" />
                        <path d="M206 490 L238 490 L238 585 L206 585 Z" fill="${shoe.color}" />
                    `;
                } else if (shoe.style === 'sandals') {
                    shoeSvg = `
                        <rect x="160" y="570" width="33" height="6" fill="${shoe.color}" />
                        <rect x="207" y="570" width="33" height="6" fill="${shoe.color}" />
                        <path d="M165 565 L188 565" stroke="${shoe.color}" stroke-width="4" />
                        <path d="M212 565 L235 565" stroke="${shoe.color}" stroke-width="4" />
                    `;
                }
            }
            document.getElementById('layer-shoes').innerHTML = shoeSvg;

            // 5. HAIRSTYLE
            const hair = database.hair.find(h => h.id === activeState.hair);
            let hairSvg = '';
            if (hair) {
                if (hair.style === 'waves') {
                    hairSvg = `
                        <!-- Back Hair -->
                        <path d="M140 160 Q120 280 145 380 Q160 380 155 240 Z" fill="${hair.color}" />
                        <path d="M260 160 Q280 280 255 380 Q240 380 245 240 Z" fill="${hair.color}" />
                        <!-- Front Bangs/Top -->
                        <path d="M150 165 C150 100 250 100 250 165 C230 140 170 140 150 165 Z" fill="${hair.color}" />
                        <path d="M150 165 Q200 185 250 165 Q220 140 150 165 Z" fill="${hair.color}" />
                    `;
                } else if (hair.style === 'bun') {
                    hairSvg = `
                        <!-- Top Bun -->
                        <circle cx="200" cy="105" r="32" fill="${hair.color}" />
                        <path d="M150 165 C155 115 245 115 250 165 Z" fill="${hair.color}" />

                } else if (hair.style === 'long') {
                    hairSvg = `
                        <path d="M140 150 C110 260 120 420 145 460 L165 460 C140 360 150 240 155 180 Z" fill="${hair.color}" />

                        <path d="M255 150 C260 210 255 245 240 250 L250 170 Z" fill="${hair.color}" />
                        <path d="M148 165 C150 110 250 110 252 165 Z" fill="${hair.color}" />
                    `;
                } else if (hair.style === 'curly') {

                        <circle cx="160" cy="140" r="25" fill="${hair.color}" />
                        <circle cx="240" cy="140" r="25" fill="${hair.color}" />
                        <circle cx="200" cy="120" r="30" fill="${hair.color}" />
                        <circle cx="145" cy="180" r="22" fill="${hair.color}" />
                        <circle cx="255" cy="180" r="22" fill="${hair.color}" />

                } else if (hair.style === 'braid') {
                    hairSvg = `
                        <path d="M150 165 C150 110 250 110 250 165 Z" fill="${hair.color}" />
                        <path d="M245 180 Q270 240 260 330 Q250 340 245 320 Q250 240 235 190 Z" fill="${hair.color}" />
                    `;
                }
            }
            document.getElementById('layer-hair').innerHTML = hairSvg;

            // 6. ACCESSORIES
            const acc = database.accessories.find(a => a.id === activeState.accessories);
            let accSvg = '';
            if (acc && acc.type !== 'none') {
                if (acc.type === 'glasses') {
                    accSvg = `
                        <rect x="165" y="168" width="30" height="16" rx="4" fill="none" stroke="${acc.color}" stroke-width="4" />
                        <rect x="205" y="168" width="30" height="16" rx="4" fill="none" stroke="${acc.color}" stroke-width="4" />

                } else if (acc.type === 'hat') {
                    accSvg = `
                        <ellipse cx="200" cy="130" rx="65" ry="12" fill="${acc.color}" />
                        <path d="M160 130 C160 85 240 85 240 130 Z" fill="${acc.color}" />

                    `;
                } else if (acc.type === 'bag') {
                    accSvg = `
                        <path d="M245 340 L275 340 L280 380 L240 380 Z" fill="${acc.color}" />

                } else if (acc.type === 'crown') {
                    accSvg = `
                        <path d="M170 125 L175 95 L187 115 L200 90 L213 115 L225 95 L230 125 Z" fill="${acc.color}" stroke="#DAA520" stroke-width="2" />
                        <circle cx="200" cy="100" r="3" fill="#FF0000" />
                    `;
                } else if (acc.type === 'necklace') {
                    accSvg = `
                        <path d="M180 230 Q200 255 220 230" stroke="${acc.color}" stroke-width="4" stroke-dasharray="6,6" fill="none" />

            document.getElementById('layer-accessories').innerHTML = accSvg;

            // Update badge info
            updateSelectedBadge();
        }

        // Switch Category View
        function switchCategory(catKey) {
            playSound('click');
            currentCategory = catKey;

            // Update tab UI
            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.classList.remove('bg-pink-500', 'text-white', 'shadow-md');
                tab.classList.add('bg-slate-100', 'text-slate-600');
            });

            const activeTab = document.getElementById(`tab-${catKey}`);
            if (activeTab) {
                activeTab.classList.remove('bg-slate-100', 'text-slate-600');
                activeTab.classList.add('bg-pink-500', 'text-white', 'shadow-md');
            }

            // Update Titles
            document.getElementById('categoryTitle').innerHTML = `
                <span class="w-3 h-3 rounded-full bg-pink-500 inline-block"></span> ${categoryTitles[catKey]}
            `;

            renderItemsGrid();
        }

        // Populate Wardrobe Grid Cards
        function renderItemsGrid() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            const items = database[currentCategory] || [];

            document.getElementById('categoryItemCount').textContent = `${items.length} خيارات`;

            items.forEach(item => {
                const isSelected = activeState[currentCategory] === item.id;
                const card = document.createElement('div');
                card.className = `item-card cursor-pointer p-3 rounded-2xl border-2 flex flex-col items-center justify-center gap-2 bg-white ${isSelected ? 'active border-pink-500' : 'border-slate-100 hover:border-pink-300'}`;
                
                // Content preview depending on category
                let previewHtml = '';
                if (currentCategory === 'skin') {
                    previewHtml = `<div class="w-10 h-10 rounded-full shadow-inner border-2 border-white" style="background-color: ${item.color}"></div>`;
                } else if (currentCategory === 'backgrounds') {
                    previewHtml = `<div class="w-12 h-10 rounded-xl ${item.class} flex items-center justify-center text-white text-lg shadow-sm"><i class="fa-solid ${item.icon}"></i></div>`;
                } else if (item.color) {
                    previewHtml = `<div class="w-10 h-10 rounded-xl flex items-center justify-center shadow-sm" style="background-color: ${item.color}22; border: 2px solid ${item.color}">
                        <div class="w-5 h-5 rounded-full" style="background-color: ${item.color}"></div>
                    </div>`;
                } else {
                    previewHtml = `<div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 font-bold text-xs"><i class="fa-solid fa-ban"></i></div>`;
                }

                card.innerHTML = `
                    ${previewHtml}
                    <span class="text-xs font-bold text-slate-700 text-center line-clamp-1">${item.name}</span>
                `;

                card.onclick = () => selectItem(currentCategory, item.id);
                grid.appendChild(card);
            });
        }

        // Select item logic
        function selectItem(category, itemId) {
            playSound('dress');
            
            // Special mutual exclusivity rules
            if (category === 'dresses' && itemId !== 'none') {
                // If dress selected, clear tops and bottoms
                activeState.tops = 'none';
                activeState.bottoms = 'none';
                activeState.dresses = itemId;
            } else if ((category === 'tops' || category === 'bottoms') && itemId !== 'none') {
                // If top or bottom selected, clear dress
                activeState.dresses = 'none';
                activeState[category] = itemId;
            } else if (category === 'backgrounds') {
                activeState.backgrounds = itemId;
                applyBackground(itemId);
            } else {
                activeState[category] = itemId;
            }

            renderDoll();
            renderItemsGrid();
        }

        // Apply Stage Scenery Background
        function applyBackground(bgId) {
            const bgItem = database.backgrounds.find(b => b.id === bgId) || database.backgrounds[0];
            const stage = document.getElementById('stageContainer');
            
            // Reset background classes
            stage.className = `relative w-full rounded-3xl overflow-hidden shadow-chic border-4 border-white transition-all duration-500 doll-container flex justify-center items-center ${bgItem.class}`;
            
            // Update Label
            document.getElementById('sceneNameLabel').textContent = bgItem.name;
        }

        // Count selected items badge
        function updateSelectedBadge() {
            let count = 0;
            Object.keys(activeState).forEach(key => {
                if (activeState[key] && activeState[key] !== 'none') {
                    count++;
                }
            });
            document.getElementById('outfitCountBadge').textContent = `قطع مختارة: ${count}`;
        }

        // Action: Randomize Outfit
        function randomizeOutfit() {
            playSound('magic');
            
            // Pick random items for each category
            const randomSkin = database.skin[Math.floor(Math.random() * database.skin.length)].id;
            const randomHair = database.hair[Math.floor(Math.random() * database.hair.length)].id;
            const randomShoes = database.shoes[Math.floor(Math.random() * database.shoes.length)].id;
            const randomAcc = database.accessories[Math.floor(Math.random() * database.accessories.length)].id;
            const randomBg = database.backgrounds[Math.floor(Math.random() * database.backgrounds.length)].id;

            activeState.skin = randomSkin;
            activeState.hair = randomHair;
            activeState.shoes = randomShoes;
            activeState.accessories = randomAcc;
            activeState.backgrounds = randomBg;

            // 50% chance of dress vs tops+bottoms
            if (Math.random() > 0.5) {
                const nonNoneDresses = database.dresses.filter(d => d.id !== 'none');
                activeState.dresses = nonNoneDresses[Math.floor(Math.random() * nonNoneDresses.length)].id;
                activeState.tops = 'none';
                activeState.bottoms = 'none';
            } else {
                activeState.dresses = 'none';
                const nonNoneTops = database.tops.filter(t => t.id !== 'none');
                const nonNoneBottoms = database.bottoms.filter(b => b.id !== 'none');
                activeState.tops = nonNoneTops[Math.floor(Math.random() * nonNoneTops.length)].id;
                activeState.bottoms = nonNoneBottoms[Math.floor(Math.random() * nonNoneBottoms.length)].id;
            }

            applyBackground(activeState.backgrounds);
            renderDoll();
            renderItemsGrid();

            showToast('✨ تم ابتكار مظهر عشوائي رائع!', 'magic');
        }

        // Action: Reset Outfit
        function resetOutfit() {
            playSound('click');
            activeState = {
                skin: 'skin_fair',
                face: 'face_glam',
                hair: 'hair_waves',
                tops: 'top_casual',
                bottoms: 'bottom_skirt',
                dresses: 'none',
                shoes: 'shoes_heels',
                accessories: 'acc_glasses',
                backgrounds: 'bg_runway'
            };

            applyBackground('bg_runway');
            renderDoll();
            renderItemsGrid();
            showToast('تمت إعادة الضبط للمظهر الافتراضي', 'info');
        }

        // Action: Take Snapshot & Download Image
        function takeSnapshot() {
            playSound('camera');
            const stage = document.getElementById('stageContainer');

            showToast('جاري التقاط الصورة وتجهيز التحميل...', 'info');

            html2canvas(stage, {
                scale: 2,
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `fashion-style-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('👑 تم حفظ صورة التنسيق بنجاح!', 'success');
            }).catch(err => {
                console.error('Snapshot error:', err);
                showToast('حدث خطأ أثناء حفظ الصورة', 'error');
            });
        }

        // Notification Toast UI Helper
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;

            if (type === 'magic') {
                toastIcon.className = 'fa-solid fa-wand-magic-sparkles text-purple-400 text-lg';
            } else if (type === 'info') {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400 text-lg';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-triangle-exclamation text-red-400 text-lg';
            } else {
                toastIcon.className = 'fa-solid fa-circle-check text-pink-400 text-lg';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2600);
        }

        // INITIALIZATION ON WINDOW LOAD
        window.onload = function() {
            renderDoll();
            switchCategory('skin');
            applyBackground('bg_runway');
        };
    </script>
